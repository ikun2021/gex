# 本地开发默认配置（连接 Docker 依赖的宿主机映射端口）
Name: match.rpc
ListenOn: 0.0.0.0:20003
Timeout: 5000
Mode: dev

Etcd:
  Hosts:
    - 127.0.0.1:12379
  Key: match.rpc

Symbol:
  - Name: IKUN_USDT
    Id: 1
    BaseCoin: IKUN
    QuoteCoin: USDT
    QuoteCoinId: 4
    BaseCoinId: 1
    QuoteCoinPrec: 4
    BaseCoinPrec: 4
  - Name: ETH_USDT
    Id: 2
    BaseCoin: ETH
    QuoteCoin: USDT
    QuoteCoinId: 4
    BaseCoinId: 3
    QuoteCoinPrec: 4
    BaseCoinPrec: 4

Coin:
  - Name: IKUN
    Id: 1
    Precision: 4
  - Name: BTC
    Id: 2
    Precision: 4
  - Name: ETH
    Id: 3
    Precision: 4
  - Name: USDT
    Id: 4
    Precision: 4

WsConf:
  etcd:
    Key: proxy
    Hosts:
      - 127.0.0.1:12379
  NonBlock: true

etcdRegisterConf:
  etcdConf:
    endpoints:
      - 127.0.0.1:12379
  key: match

PulsarConfig:
  hosts:
    - 127.0.0.1:16650

RedisConf:
  Host: 127.0.0.1:16379
  Type: node
  PingTimeout: 5s

LoggerConfig:
  level: debug
  stacktrace: true
  addCaller: true
  callerShip: 3
  mode: console
  json: false
  color: true
  isReport: false
