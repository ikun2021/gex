# 业务服务：需先启动 deploy/depend/docker-compose.yaml，并创建外部网络 gex
# 构建：在项目根目录执行 make build && docker compose -f deploy/dockerfiles/docker-compose.yaml up -d --build
version: "3.7"

services:
  accountrpc:
    build:
      context: ../..
      dockerfile: deploy/dockerfiles/Dockerfile-accountrpc
    image: gex/accountrpc:latest
    container_name: gex-accountrpc
    restart: unless-stopped
    entrypoint: ["/app/accountrpc", "-f", "/app/account.rpc.yaml"]
    ports:
      - "20002:20002"
    networks:
      - gex

  match:
    build:
      context: ../..
      dockerfile: deploy/dockerfiles/Dockerfile-match
    image: gex/match:latest
    container_name: gex-match
    restart: unless-stopped
    entrypoint: ["/app/match", "-f", "/app/match.yaml"]
    ports:
      - "20003:20003"
    networks:
      - gex

  quoterpc:
    build:
      context: ../..
      dockerfile: deploy/dockerfiles/Dockerfile-quoterpc
    image: gex/quoterpc:latest
    container_name: gex-quoterpc
    restart: unless-stopped
    entrypoint: ["/app/quoterpc", "-f", "/app/quote.rpc.yaml"]
    ports:
      - "20011:20011"
    networks:
      - gex

  gateway:
    build:
      context: ../..
      dockerfile: deploy/dockerfiles/Dockerfile-gateway
    image: gex/gateway:latest
    container_name: gex-gateway
    restart: unless-stopped
    entrypoint: ["/app/gateway", "-f", "/app/gateway.yaml"]
    ports:
      - "8888:8888"
    networks:
      - gex

  adminapi:
    build:
      context: ../..
      dockerfile: deploy/dockerfiles/Dockerfile-adminapi
    image: gex/adminapi:latest
    container_name: gex-adminapi
    restart: unless-stopped
    entrypoint: ["/app/adminapi", "-f", "/app/admin.yaml"]
    ports:
      - "20015:20015"
    networks:
      - gex

networks:
  gex:
    external: true
