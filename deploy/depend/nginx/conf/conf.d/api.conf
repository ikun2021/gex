server {
    listen 80;
    server_name dev.api.gex.com;

    # Docker 内置 DNS；proxy_pass 使用变量以延迟解析，避免 upstream 尚未启动时 nginx 启动失败
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 行情 / 深度 -> gateway
    location /quotes/ {
        set $gateway http://gex-gateway:8888;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 订单 -> gateway
    location /order/ {
        set $gateway http://gex-gateway:8888;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 账户 -> gateway
    location /account/ {
        set $gateway http://gex-gateway:8888;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket -> wssocket（容器内 9992）
    location ^~ /ws {
        set $wssocket http://gex-wssocket:9992;
        proxy_http_version 1.1;
        proxy_pass $wssocket$request_uri;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header Upgrade "websocket";
        proxy_set_header Connection "upgrade";
    }
}
